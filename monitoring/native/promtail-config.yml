server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: pm2-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: discount-api
          app: jmomand12-backend
          env: production
          __path__: /root/.pm2/logs/discount-api-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            responseTime: responseTime
            req_method: req.method
            req_url: req.url
            status: res.statusCode
            error: err.message
      - labels:
          level: level
          status: status
          req_method: req_method

  - job_name: nginx-access-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/access.log

  - job_name: nginx-error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          env: production
          __path__: /var/log/nginx/error.log
